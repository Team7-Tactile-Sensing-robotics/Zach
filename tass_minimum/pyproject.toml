[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tass-minimum"
version = "0.1.0"
description = "Modular single-joint TASS mechanics and string-vibration simulator"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.scripts]
tass = "tass.cli:main"

[tool.setuptools.packages.find]
include = ["tass*"]
